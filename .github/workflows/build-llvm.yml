name: Build LLVM

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the 'prebuilt-artifacts' release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prebuilt-artifacts --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create prebuilt-artifacts \
            --repo "${{ github.repository }}" \
            --title "Prebuilt package output trees" \
            --notes "Auto-published by package-prebuild workflows (e.g. Build webkitgtk, Build LLVM). Assets are overwritten (--clobber) on every run; do not depend on a specific historical version." \
            --target main

  build-and-publish:
    needs: ensure-release
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only generic-x86_64 enables BR2_PACKAGE_MESA3D_LLVM (radeonsi's
          # runtime shader compiler needs real LLVM; crocus/iris only need it
          # for their host-side mesa-clc build tool). Neither RPi defconfig
          # builds LLVM at all, so there's nothing for them to prebuild here.
          - service: x86_64-llvm
            board: generic-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check producer/consumer defconfig sync
        run: bash avio_configs/scripts/check-toolchain-sync.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache

      - name: Download prebuilt toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "toolchains/${{ matrix.board }}"
          if ! gh release download toolchains \
              --repo "${{ github.repository }}" \
              --pattern "toolchain-${{ matrix.board }}.tar.gz" \
              --output "toolchain-${{ matrix.board }}.tar.gz" \
              --clobber; then
            echo "::error::No prebuilt toolchain asset for ${{ matrix.board }} on the 'toolchains' release. Run the 'Build toolchain' workflow (workflow_dispatch) first."
            exit 1
          fi
          tar xzf "toolchain-${{ matrix.board }}.tar.gz" -C "toolchains/${{ matrix.board }}"
          chmod -R 777 toolchains
          "toolchains/${{ matrix.board }}/relocate-sdk.sh" "/app/toolchains/${{ matrix.board }}"

      - name: Restore LLVM ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: llvm-ccache-v1-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: |
            llvm-ccache-v1-${{ matrix.board }}-

      - name: Prepare bind-mounted directories
        run: |
          mkdir -p .ccache images
          chmod -R 777 .ccache images

      - name: Build ${{ matrix.board }} LLVM
        run: docker compose run --rm ${{ matrix.service }}

      - name: Publish LLVM prebuild to the 'prebuilt-artifacts' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload prebuilt-artifacts images/llvm-${{ matrix.board }}.tar.gz.part-* \
            --repo "${{ github.repository }}" --clobber

      - name: Upload LLVM prebuild as a workflow artifact (debug/inspection)
        uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ matrix.board }}
          path: images/llvm-${{ matrix.board }}.tar.gz.part-*
          if-no-files-found: error
