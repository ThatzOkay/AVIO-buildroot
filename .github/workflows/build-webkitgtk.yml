name: Build webkitgtk

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the 'prebuilt-artifacts' release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prebuilt-artifacts --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create prebuilt-artifacts \
            --repo "${{ github.repository }}" \
            --title "Prebuilt package output trees" \
            --notes "Auto-published by package-prebuild workflows (e.g. Build webkitgtk, Build LLVM). Assets are overwritten (--clobber) on every run; do not depend on a specific historical version." \
            --target main

  build-and-publish:
    needs: ensure-release
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap a job at 360 minutes (6h) regardless of
    # this setting - 358 leaves the most headroom possible under that ceiling
    # without exceeding it. generic-x86_64 (with the LLVM prebuild restored,
    # see build-llvm-prebuilt.sh) was observed reaching 90% of WebKitGTK's
    # own build at the old 330-minute mark, so this should be enough.
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: rpi4-webkitgtk
            board: raspberrypi4
          - service: rpi5-webkitgtk
            board: raspberrypi5
          - service: x86_64-webkitgtk
            board: generic-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check producer/consumer defconfig sync
        run: bash avio_configs/scripts/check-toolchain-sync.sh

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache

      - name: Download prebuilt toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "toolchains/${{ matrix.board }}"
          if ! gh release download toolchains \
              --repo "${{ github.repository }}" \
              --pattern "toolchain-${{ matrix.board }}.tar.gz" \
              --output "toolchain-${{ matrix.board }}.tar.gz" \
              --clobber; then
            echo "::error::No prebuilt toolchain asset for ${{ matrix.board }} on the 'toolchains' release. Run the 'Build toolchain' workflow (workflow_dispatch) first."
            exit 1
          fi
          tar xzf "toolchain-${{ matrix.board }}.tar.gz" -C "toolchains/${{ matrix.board }}"
          chmod -R 777 toolchains
          "toolchains/${{ matrix.board }}/relocate-sdk.sh" "/app/toolchains/${{ matrix.board }}"

      # generic-x86_64 only: BR2_PACKAGE_MESA3D_LLVM makes host-llvm + llvm
      # alone take ~4h from cold, which combined with WebKitGTK's own ~5h
      # blows past GitHub Actions' 6h-per-job ceiling on hosted runners. See
      # avio_configs/scripts/build-llvm-prebuilt.sh for the producer side.
      - name: Download prebuilt LLVM [generic-x86_64]
        if: matrix.board == 'generic-x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download prebuilt-artifacts \
              --repo "${{ github.repository }}" \
              --pattern "llvm-${{ matrix.board }}.tar.gz.part-*" \
              --clobber; then
            echo "::error::No prebuilt LLVM asset for ${{ matrix.board }} on the 'prebuilt-artifacts' release. Run the 'Build LLVM' workflow (workflow_dispatch) first."
            exit 1
          fi
          cat llvm-${{ matrix.board }}.tar.gz.part-* > "llvm-${{ matrix.board }}.tar.gz"
          rm -f llvm-${{ matrix.board }}.tar.gz.part-*

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: webkitgtk-ccache-v1-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: |
            webkitgtk-ccache-v1-${{ matrix.board }}-

      - name: Prepare bind-mounted directories
        run: |
          mkdir -p .ccache images
          chmod -R 777 .ccache images

      - name: Build ${{ matrix.board }} webkitgtk
        run: docker compose run --rm ${{ matrix.service }}

      - name: Publish webkitgtk prebuild to the 'prebuilt-artifacts' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload prebuilt-artifacts images/webkitgtk-${{ matrix.board }}.tar.gz.part-* \
            --repo "${{ github.repository }}" --clobber

      - name: Upload webkitgtk prebuild as a workflow artifact (debug/inspection)
        uses: actions/upload-artifact@v4
        with:
          name: webkitgtk-${{ matrix.board }}
          path: images/webkitgtk-${{ matrix.board }}.tar.gz.part-*
          if-no-files-found: error
